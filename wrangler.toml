name = "nexusdefend"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# The client and its 21MB of sprites are served by this same Worker rather than by R2 or a
# separate host. That keeps the game, the API and the WebSocket on one origin - no CORS, one
# deploy, one domain - and static assets are free and cached at the edge.
#
# The directory is the repo root so GitHub Pages can keep serving the identical tree without
# moving index.html or duplicating assets. .assetsignore keeps worker/, test/ and tooling out.
[assets]
directory = "."
binding = "ASSETS"

# One Durable Object per match. It holds the authoritative world and is the only thing
# allowed to change it; clients send intents and receive snapshots.
[[durable_objects.bindings]]
name = "MATCH"
class_name = "MatchRoom"

# SQLite-backed Durable Objects, which is what makes this workable without a paid plan.
# The older KV-backed classes (`new_classes`) are paid-only.
# A lobby, keyed by friend code. This one hibernates: four people staring at a lobby is four
# sockets and no work, and hibernation costs nothing while idle. MatchRoom cannot hibernate
# because eviction would kill its tick timer; a party has no timer to kill.
[[durable_objects.bindings]]
name = "PARTY"
class_name = "PartyRoom"

# One queue for the whole game. Shard it by region or mode long before that stops being true.
[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

# Match history and player records. Written once when a match ends, never per tick - a
# Durable Object writing to D1 twenty times a second would be a database with a game attached.
[[d1_databases]]
binding = "DB"
database_name = "nexusdefend"
database_id = "local-dev-placeholder"

# Replays: a seed and a compressed input log per match. A whole run in a few KB, because the
# simulation is deterministic, which is what Phase 1 bought.
[[kv_namespaces]]
binding = "REPLAYS"
id = "local-dev-placeholder"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PartyRoom", "Matchmaker"]
